name: PROD GKE Deploy - Apigee Deployment Service

on:
  push:
    branches:
      - gke_mongo_db
  workflow_dispatch:

env:
  PROJECT_ID: probestack-prod
  ARTIFACT_REPO: probestack-prod-apps
  ARTIFACT_REGISTRY: us-central1-docker.pkg.dev
  SERVICE_NAME: fsp-compliance-svc
  GKE_CLUSTER: probestack-zonal-cluster
  GKE_LOCATION: us-central1-a
  GKE_LOCATION_FLAG: --zone
  NAMESPACE: forgesphere-prod

jobs:
  deploy-prod-profile-config:

    if: github.ref == 'refs/heads/gke_mongo_db'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/861433193200/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions-deployer@probestack-prod.iam.gserviceaccount.com
          token_format: access_token

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Install GKE auth plugin
        run: gcloud components install gke-gcloud-auth-plugin --quiet

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build JAR
        run: mvn --batch-mode --no-transfer-progress clean package -DskipTests

      - name: Login to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: us-central1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          provenance: false
          tags: |
            ${{ env.ARTIFACT_REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials ${{ env.GKE_CLUSTER }} \
          ${{ env.GKE_LOCATION_FLAG }} ${{ env.GKE_LOCATION }} \
          --project ${{ env.PROJECT_ID }}

      # ============================================================
      #  D E B U G   S T E P S   
      # ============================================================

      - name: Deploy new image (rollout trigger)
        run: |
          kubectl set image deployment/${{ env.SERVICE_NAME }} \
          ${{ env.SERVICE_NAME }}=${{ env.ARTIFACT_REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }} \
          -n ${{ env.NAMESPACE }}

      - name: Wait for new pod to be created
        run: |
          echo "Waiting for new pod to appear..."
          sleep 10
          NEW_POD=$(kubectl get pods -n ${{ env.NAMESPACE }} -l app=${{ env.SERVICE_NAME }} --sort-by=.metadata.creationTimestamp -o jsonpath='{.items[-1].metadata.name}')
          echo "NEW_POD=$NEW_POD" >> $GITHUB_ENV
          echo "New pod: $NEW_POD"

      - name: Describe new pod (events, status, conditions)
        run: |
          echo "===== POD DESCRIPTION ====="
          kubectl describe pod -n ${{ env.NAMESPACE }} ${{ env.NEW_POD }}
          echo "=========================="

      - name: Fetch current logs from new pod
        run: |
          echo "===== CURRENT LOGS (immediate) ====="
          kubectl logs -n ${{ env.NAMESPACE }} ${{ env.NEW_POD }} --tail=100 || echo "No logs yet (container may not have started)"
          echo "==================================="

      - name: Wait 2 minutes for startup to stabilise
        run: |
          echo "Waiting 120 seconds to collect more logs..."
          sleep 120

      - name: Fetch logs again after 2 minutes
        run: |
          echo "===== LOGS AFTER 2 MINUTES ====="
          kubectl logs -n ${{ env.NAMESPACE }} ${{ env.NEW_POD }} --tail=200 || echo "Pod may have crashed - check describe"
          echo "================================"

      - name: Check rollout status (non‑blocking, but logs already captured)
        run: |
          echo "Checking rollout status (timeout 2 minutes)..."
          kubectl rollout status deployment/${{ env.SERVICE_NAME }} -n ${{ env.NAMESPACE }} --timeout=2m || true
          # Do NOT fail the workflow here because we already captured logs.
          # The pipeline will continue so you can see the final pod status.

      - name: Final pod status
        run: |
          echo "===== FINAL POD STATUS ====="
          kubectl get pods -n ${{ env.NAMESPACE }} -l app=${{ env.SERVICE_NAME }}
          echo "============================"