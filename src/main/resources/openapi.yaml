openapi: 3.0.3
info:
  description: |
    API specification for probestack-compliance-service.

    This service manages governance compliance rules and supports compliance scanning
    for microservices, Apigee proxies, and Kong resources.

    ## Microservice

    Microservice Name: probestack-compliance-service

    ## MongoDB Collections

    ### governance_compliance_rules

    Stores compliance rule definitions used by the UI and scan engine.

    Primary Fields:
    - ruleId: Unique rule identifier generated by Java service. Example: CR13
    - ruleName: Compliance rule display name
    - ruleDescription: Detailed rule description
    - ruleType: PRE_DEFINED or CUSTOM
    - ruleOwner: Owner team or person
    - category: DOCUMENTATION, LOGGING, SECURITY, PERFORMANCE, HEALTH, GENERAL
    - severity: REQUIRED, MANDATORY, RECOMMENDED, OPTIONAL
    - enabled: Whether the rule is enabled
    - mandatory: Whether the rule is mandatory
    - displayOrder: UI display order
    - icon: UI icon name
    - status: complaint or non-compliant
    - createDate: Created timestamp
    - createdBy: User who created the rule
    - updatedDate: Last updated timestamp
    - updatedBy: User who last updated the rule

    Recommended Indexes:
    - Unique index on ruleId
    - Compound index on status, category, ruleType

    ### governance_compliance_scans

    Stores submitted, running, completed, and failed compliance scan executions.

    Primary Fields:
    - scanId: Unique scan identifier generated by Java service
    - projectName: Project name
    - companyName: Company name
    - assetId: Asset identifier
    - assetName: Microservice, proxy, or resource name
    - assetType: MICROSERVICE, APIGEE, KONG
    - sourceType: GITHUB, GITLAB, BITBUCKET, ZIP_UPLOAD, BUNDLE_UPLOAD
    - source: Repository or uploaded bundle details
    - rules: Rule selection details
    - scanOptions: Scan execution options
    - status: submitted, running, completed, error
    - compliance: PENDING, COMPLIANT, NON_COMPLIANT, PARTIAL
    - scanResults: Rule-level scan results
    - scanDate: Actual scan completion date
    - createDate: Created timestamp
    - createdBy: User who submitted the scan
    - updatedDate: Last updated timestamp
    - updatedBy: User or scheduler that last updated the record

    Recommended Indexes:
    - Unique index on scanId
    - Compound index on status, createDate
    - Compound index on projectName, assetType, assetName

    ## Scheduler

    Scheduler Task: ComplianceScanScheduler is also inside the probestack-compliance-service.

    Frequency: Every 5 minutes

    Processing Flow:
    1. Fetch records from governance_compliance_scans where status = submitted.
    2. Process records one by one.
    3. Fetch selected compliance rules.
    4. Fetch source code or proxy bundle.
    5. Scan the source against selected rules.
    6. Store scan results in the governance_compliance_scans collection
    7. Update status to completed or error.
  title: Probestack Compliance Service API
  version: 1.0.0
servers:
- description: Production
  url: https://prod.probestack.io
- description: Local Development
  url: http://localhost:8080
tags:
- description: APIs for creating and fetching compliance rules.
  name: Compliance Rules
- description: APIs for submitting and fetching compliance scan executions.
  name: Compliance Scan
paths:
  /governance/v1/compliance-rules:
    get:
      description: Fetch compliance rules for UI display.
      operationId: getComplianceRules
      parameters:
      - description: Optional project name filter. The UI may omit this when it only has selected resource ids.
        example: Payment Gateway
        explode: true
        in: query
        name: projectName
        required: false
        schema:
          type: string
        style: form
      - description: Resource type selected in the UI.
        example: MICROSERVICE
        explode: true
        in: query
        name: resourceType
        required: false
        schema:
          $ref: "#/components/schemas/AssetType"
        style: form
      - description: Resource name selected in the UI.
        example: Remit2Any
        explode: true
        in: query
        name: resourceName
        required: false
        schema:
          type: string
        style: form
      - description: Rule status filter.
        example: active
        explode: true
        in: query
        name: status
        required: false
        schema:
          $ref: "#/components/schemas/RuleStatus"
        style: form
      - description: Rule category filter.
        example: DOCUMENTATION
        explode: true
        in: query
        name: ruleCategory
        required: false
        schema:
          $ref: "#/components/schemas/RuleCategory"
        style: form
      responses:
        "200":
          content:
            application/json:
              example:
                projectName: Payment Gateway
                resourceType: MICROSERVICE
                resourceName: Remit2Any
                activeRules: 29
                totalRules: 30
                rules:
                - ruleId: CR13
                  ruleName: Documentation required for all endpoints
                  ruleDescription: "Every API endpoint must have comprehensive documentation\
                    \ including request/response schemas, error codes, and usage examples."
                  category: DOCUMENTATION
                  severity: REQUIRED
                  ruleType: PRE_DEFINED
                  ruleOwner: Governance Team
                  enabled: true
                  mandatory: true
                  displayOrder: 1
                  icon: file-text
                  status: active
                  createDate: 2026-05-11T19:30:00Z
                  createdBy: admin@probestack.io
                  updatedDate: 2026-05-11T19:30:00Z
                  updatedBy: admin@probestack.io
              schema:
                $ref: "#/components/schemas/ComplianceRulesResponse"
          description: Compliance rules fetched successfully.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Invalid request.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal server error.
      summary: Get compliance rules
      tags:
      - Compliance Rules
      x-accepts: application/json
      x-tags:
      - tag: Compliance Rules
    post:
      description: |
        Adds a new compliance rule.

        ruleId is generated by Java service and should not be sent by UI.
      operationId: createComplianceRule
      requestBody:
        content:
          application/json:
            example:
              ruleName: Documentation required for all endpoints
              ruleDescription: "Every API endpoint must have comprehensive documentation\
                \ including request/response schemas, error codes, and usage examples."
              ruleType: PRE_DEFINED
              ruleOwner: Governance Team
              category: DOCUMENTATION
              severity: REQUIRED
              enabled: true
              mandatory: true
              displayOrder: 1
              icon: file-text
              status: active
              createdBy: admin@probestack.io
              updatedBy: admin@probestack.io
            schema:
              $ref: "#/components/schemas/CreateComplianceRuleRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              example:
                ruleId: CR13
                ruleName: Documentation required for all endpoints
                status: active
                message: Compliance rule created successfully.
              schema:
                $ref: "#/components/schemas/CreateComplianceRuleResponse"
          description: Compliance rule created successfully.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Invalid request.
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Duplicate rule.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal server error.
      summary: Add compliance rule
      tags:
      - Compliance Rules
      x-content-type: application/json
      x-accepts: application/json
      x-tags:
      - tag: Compliance Rules
  /governance/v1/compliance-rules/{ruleId}/status:
    patch:
      description: Enable, disable, activate, or deactivate a compliance rule from the Governance UI.
      operationId: updateComplianceRuleStatus
      parameters:
      - description: Compliance rule identifier.
        example: CR001
        explode: false
        in: path
        name: ruleId
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateComplianceRuleStatusRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateComplianceRuleStatusResponse"
          description: Compliance rule status updated successfully.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Compliance rule not found.
      summary: Update compliance rule status
      tags:
      - Compliance Rules
  /governance/v1/compliance-scan:
    post:
      description: |
        Stores compliance scan request with status submitted and returns response quickly.
        Actual scan processing is handled asynchronously by ComplianceScanScheduler.
      operationId: submitComplianceScan
      requestBody:
        content:
          application/json:
            example:
              projectName: Payment Gateway
              companyName: Probestack
              assetId: PG-001
              assetName: Remit2Any
              assetType: MICROSERVICE
              sourceType: GITHUB
              source:
                repositoryUrl: https://github.com/probestack/payment-service
                branch: main
                accessTokenRef: github-token-secret-ref
              rules:
                ruleTypes:
                - PRE_DEFINED
                - CUSTOM
                ruleIds:
                - CR1
                - CR2
              scanOptions:
                scanMode: FULL
                includeInactiveRules: false
                saveResult: true
              requestedBy: admin@probestack.io
            schema:
              $ref: "#/components/schemas/SubmitComplianceScanRequest"
        required: true
      responses:
        "202":
          content:
            application/json:
              example:
                scanId: SCAN-20260511-000001
                status: submitted
                message: Compliance scan request submitted successfully.
                submittedDate: 2026-05-11T20:00:00Z
              schema:
                $ref: "#/components/schemas/SubmitComplianceScanResponse"
          description: Compliance scan request submitted successfully.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Invalid request.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal server error.
      summary: Submit compliance scan
      tags:
      - Compliance Scan
      x-content-type: application/json
      x-accepts: application/json
      x-tags:
      - tag: Compliance Scan
  /governance/v1/compliance-scans/run-check:
    post:
      description: Submit compliance scans for one or more selected UI resources. If source.archiveDownloadUrl is provided, that generated archive is scanned before falling back to stored resource source details.
      operationId: runComplianceCheck
      requestBody:
        content:
          application/json:
            example:
              projectName: E-Commerce Platform
              projectId: PRJ-ECOMMERCE
              companyName: ProbeStack
              assetType: MICROSERVICE
              resources:
              - resourceId: RES-MS-AUDIT-PRODUCT-APP
                resourceName: MS-Audit-Product-App
                assetType: MICROSERVICE
                sourceType: BUNDLE_UPLOAD
                source:
                  archiveDownloadUrl: https://storage.probestack.io/codegen-result/archive.zip
              scanOptions:
                scanMode: FULL
                includeInactiveRules: false
                saveResult: true
              requestedBy: admin@probestack.io
            schema:
              $ref: "#/components/schemas/RunComplianceCheckRequest"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunComplianceCheckResponse"
          description: Compliance run check submitted successfully.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Invalid request.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Matching resources not found.
      summary: Run compliance check for selected resources
      tags:
      - Compliance Scan
  /governance/v1/compliance-scan/{scanId}:
    get:
      description: Fetch scan status and results by scanId.
      operationId: getComplianceScanById
      parameters:
      - description: Unique scan identifier.
        example: SCAN-20260511-000001
        explode: false
        in: path
        name: scanId
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplianceScanDetailsResponse"
          description: Compliance scan details fetched successfully.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Scan not found.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal server error.
      summary: Get compliance scan status and result
      tags:
      - Compliance Scan
      x-accepts: application/json
      x-tags:
      - tag: Compliance Scan
  /governance/v1/compliance-scans/recent:
    get:
      description: Fetch recent compliance scan executions for the Recent Results UI tab.
      operationId: getRecentComplianceScans
      parameters:
      - description: Project name used by UI context.
        example: E-Commerce Platform
        explode: true
        in: query
        name: projectName
        required: false
        schema:
          type: string
        style: form
      - description: Asset type filter.
        example: MICROSERVICE
        explode: true
        in: query
        name: assetType
        required: false
        schema:
          $ref: "#/components/schemas/AssetType"
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/ComplianceScanDetailsResponse"
                type: array
          description: Recent compliance scans fetched successfully.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal server error.
      summary: Get recent compliance scan results
      tags:
      - Compliance Scan
components:
  schemas:
    AssetType:
      enum:
      - MICROSERVICE
      - APIGEE
      - KONG
      type: string
    SourceType:
      enum:
      - GITHUB
      - GITLAB
      - BITBUCKET
      - ZIP_UPLOAD
      - BUNDLE_UPLOAD
      type: string
    RuleType:
      enum:
      - PRE_DEFINED
      - CUSTOM
      type: string
    RuleCategory:
      enum:
      - DOCUMENTATION
      - LOGGING
      - SECURITY
      - PERFORMANCE
      - HEALTH
      - GENERAL
      type: string
    RuleSeverity:
      enum:
      - REQUIRED
      - MANDATORY
      - RECOMMENDED
      - OPTIONAL
      type: string
    RuleStatus:
      enum:
      - active
      - inactive
      type: string
    ScanStatus:
      enum:
      - submitted
      - running
      - completed
      - error
      type: string
    ComplianceStatus:
      enum:
      - PENDING
      - COMPLIANT
      - NON_COMPLIANT
      - PARTIAL
      type: string
    ScanMode:
      enum:
      - FULL
      - SELECTED_RULES
      - INCREMENTAL
      type: string
    ScanResultStatus:
      enum:
      - PASSED
      - FAILED
      - WARNING
      - SKIPPED
      type: string
    CreateComplianceRuleRequest:
      example:
        severity: null
        updatedBy: admin@probestack.io
        displayOrder: 1
        icon: file-text
        mandatory: true
        ruleDescription: "Every API endpoint must have comprehensive documentation\
          \ including request/response schemas, error codes, and usage examples."
        enabled: true
        createdBy: admin@probestack.io
        ruleType: null
        ruleName: Documentation required for all endpoints
        ruleOwner: Governance Team
        category: null
        status: null
      properties:
        ruleName:
          example: Documentation required for all endpoints
          type: string
        ruleDescription:
          example: "Every API endpoint must have comprehensive documentation including\
            \ request/response schemas, error codes, and usage examples."
          type: string
        ruleType:
          $ref: "#/components/schemas/RuleType"
        ruleOwner:
          example: Governance Team
          type: string
        category:
          $ref: "#/components/schemas/RuleCategory"
        severity:
          $ref: "#/components/schemas/RuleSeverity"
        enabled:
          example: true
          type: boolean
        mandatory:
          example: true
          type: boolean
        displayOrder:
          example: 1
          type: integer
        icon:
          example: file-text
          type: string
        status:
          $ref: "#/components/schemas/RuleStatus"
        createdBy:
          example: admin@probestack.io
          type: string
        updatedBy:
          example: admin@probestack.io
          type: string
      required:
      - category
      - createdBy
      - enabled
      - ruleName
      - ruleOwner
      - ruleType
      - severity
      - status
      - updatedBy
      type: object
    CreateComplianceRuleResponse:
      example:
        ruleName: Documentation required for all endpoints
        ruleId: CR13
        message: Compliance rule created successfully.
        status: null
      properties:
        ruleId:
          example: CR13
          type: string
        ruleName:
          example: Documentation required for all endpoints
          type: string
        status:
          $ref: "#/components/schemas/RuleStatus"
        message:
          example: Compliance rule created successfully.
          type: string
      type: object
    ComplianceRulesResponse:
      example:
        resourceName: Remit2Any
        rules:
        - severity: null
          updatedBy: updatedBy
          displayOrder: 0
          icon: icon
          updatedDate: 2000-01-23T04:56:07.000+00:00
          mandatory: true
          ruleDescription: ruleDescription
          enabled: true
          createdBy: createdBy
          ruleType: null
          ruleName: Documentation required for all endpoints
          ruleOwner: Governance Team
          ruleId: CR13
          category: null
          status: null
          createDate: 2000-01-23T04:56:07.000+00:00
        - severity: null
          updatedBy: updatedBy
          displayOrder: 0
          icon: icon
          updatedDate: 2000-01-23T04:56:07.000+00:00
          mandatory: true
          ruleDescription: ruleDescription
          enabled: true
          createdBy: createdBy
          ruleType: null
          ruleName: Documentation required for all endpoints
          ruleOwner: Governance Team
          ruleId: CR13
          category: null
          status: null
          createDate: 2000-01-23T04:56:07.000+00:00
        projectName: Payment Gateway
        activeRules: 29
        totalRules: 30
        resourceType: null
      properties:
        projectName:
          example: Payment Gateway
          type: string
        resourceType:
          $ref: "#/components/schemas/AssetType"
        resourceName:
          example: Remit2Any
          type: string
        activeRules:
          example: 29
          type: integer
        totalRules:
          example: 30
          type: integer
        rules:
          items:
            $ref: "#/components/schemas/ComplianceRule"
          type: array
      type: object
    ComplianceRule:
      example:
        severity: null
        updatedBy: updatedBy
        displayOrder: 0
        icon: icon
        updatedDate: 2000-01-23T04:56:07.000+00:00
        mandatory: true
        ruleDescription: ruleDescription
        enabled: true
        createdBy: createdBy
        ruleType: null
        ruleName: Documentation required for all endpoints
        ruleOwner: Governance Team
        ruleId: CR13
        category: null
        status: null
        createDate: 2000-01-23T04:56:07.000+00:00
      properties:
        ruleId:
          example: CR13
          type: string
        ruleName:
          example: Documentation required for all endpoints
          type: string
        ruleDescription:
          type: string
        category:
          $ref: "#/components/schemas/RuleCategory"
        severity:
          $ref: "#/components/schemas/RuleSeverity"
        ruleType:
          $ref: "#/components/schemas/RuleType"
        ruleOwner:
          example: Governance Team
          type: string
        enabled:
          type: boolean
        mandatory:
          type: boolean
        displayOrder:
          type: integer
        icon:
          type: string
        status:
          $ref: "#/components/schemas/RuleStatus"
        createDate:
          format: date-time
          type: string
        createdBy:
          type: string
        updatedDate:
          format: date-time
          type: string
        updatedBy:
          type: string
      type: object
    SubmitComplianceScanRequest:
      example:
        scanOptions:
          saveResult: true
          scanMode: null
          includeInactiveRules: false
        requestedBy: admin@probestack.io
        sourceType: null
        assetId: PG-001
        companyName: Probestack
        assetName: Remit2Any
        rules:
          ruleIds:
          - CR1
          - CR2
          ruleTypes:
          - PRE_DEFINED
          - CUSTOM
        source:
          accessTokenRef: github-token-secret-ref
          bundleName: Remit2Any.zip
          bundleFileId: file_12345
          branch: main
          repositoryUrl: https://github.com/probestack/payment-service
        projectName: Payment Gateway
        assetType: null
      properties:
        projectName:
          example: Payment Gateway
          type: string
        companyName:
          example: Probestack
          type: string
        assetId:
          example: PG-001
          type: string
        assetName:
          example: Remit2Any
          type: string
        assetType:
          $ref: "#/components/schemas/AssetType"
        sourceType:
          $ref: "#/components/schemas/SourceType"
        source:
          $ref: "#/components/schemas/ScanSource"
        rules:
          $ref: "#/components/schemas/ScanRules"
        scanOptions:
          $ref: "#/components/schemas/ScanOptions"
        requestedBy:
          example: admin@probestack.io
          type: string
      required:
      - assetId
      - assetName
      - assetType
      - companyName
      - projectName
      - requestedBy
      type: object
    RunComplianceCheckRequest:
      properties:
        assetType:
          $ref: "#/components/schemas/AssetType"
        microserviceId:
          description: Single selected microservice id. Prefer microserviceIds for multi-select.
          example: MS-Audit-Product-App
          type: string
        microserviceIds:
          description: Selected microservice ids from the onboarding API. The compliance service resolves project, name, and archiveDownloadUrl from onboarding.
          items:
            type: string
          type: array
        resources:
          deprecated: true
          description: Deprecated compatibility field. The UI should pass ids only.
          items:
            $ref: "#/components/schemas/RunComplianceResourceRequest"
          type: array
        resourceIds:
          description: Selected Apigee or Kong resource ids from the onboarding API.
          items:
            type: string
          type: array
        resourceNames:
          deprecated: true
          items:
            type: string
          type: array
        sourceType:
          deprecated: true
          $ref: "#/components/schemas/SourceType"
        source:
          deprecated: true
          $ref: "#/components/schemas/ScanSource"
        rules:
          $ref: "#/components/schemas/ScanRules"
        scanOptions:
          $ref: "#/components/schemas/ScanOptions"
        requestedBy:
          example: admin@probestack.io
          type: string
      required:
      - assetType
      type: object
    RunComplianceResourceRequest:
      properties:
        resourceId:
          example: RES-MS-AUDIT-PRODUCT-APP
          type: string
        resourceName:
          example: MS-Audit-Product-App
          type: string
        assetType:
          $ref: "#/components/schemas/AssetType"
        sourceType:
          $ref: "#/components/schemas/SourceType"
        source:
          $ref: "#/components/schemas/ScanSource"
      required:
      - resourceName
      type: object
    RunComplianceCheckResponse:
      properties:
        message:
          example: Compliance run check submitted successfully.
          type: string
        submittedScans:
          example: 2
          format: int32
          type: integer
        scans:
          items:
            $ref: "#/components/schemas/SubmitComplianceScanResponse"
          type: array
      type: object
    ScanSource:
      description: Repository or uploaded bundle details.
      example:
        accessTokenRef: github-token-secret-ref
        bundleName: Remit2Any.zip
        bundleFileId: file_12345
        archiveDownloadUrl: https://storage.probestack.io/codegen-result/archive.zip
        branch: main
        repositoryUrl: https://github.com/probestack/payment-service
      properties:
        repositoryUrl:
          example: https://github.com/probestack/payment-service
          type: string
        branch:
          example: main
          type: string
        accessTokenRef:
          example: github-token-secret-ref
          type: string
        bundleFileId:
          example: file_12345
          type: string
        bundleName:
          example: Remit2Any.zip
          type: string
        archiveDownloadUrl:
          description: Generated bundle archive URL from codegen_result. When provided, the scanner downloads and scans this archive before falling back to Git repository sources.
          example: https://storage.probestack.io/codegen-result/archive.zip
          type: string
      type: object
    ScanRules:
      example:
        ruleIds:
        - CR1
        - CR2
        ruleTypes:
        - PRE_DEFINED
        - CUSTOM
      properties:
        ruleTypes:
          example:
          - PRE_DEFINED
          - CUSTOM
          items:
            $ref: "#/components/schemas/RuleType"
          type: array
        ruleIds:
          example:
          - CR1
          - CR2
          items:
            type: string
          type: array
      required:
      - ruleTypes
      type: object
    ScanOptions:
      example:
        saveResult: true
        scanMode: null
        includeInactiveRules: false
      properties:
        scanMode:
          $ref: "#/components/schemas/ScanMode"
        includeInactiveRules:
          example: false
          type: boolean
        saveResult:
          example: true
          type: boolean
      required:
      - includeInactiveRules
      - saveResult
      - scanMode
      type: object
    SubmitComplianceScanResponse:
      example:
