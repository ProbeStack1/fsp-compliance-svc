spring.application.name=compliance-api
server.port=8188
server.servlet.context-path=/compliance-api
spring.jackson.date-format=com.probestack.forgesphere.RFC3339DateFormat
spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false

# ===== Template Properties =====
#################################################
## Management endpoints configurations
#################################################
management.endpoints.web.exposure.include=info,health,env
management.endpoint.health.show-details=always
management.health.mail.enabled=false

#################################################
## Database connection configuration
#################################################

spring.data.mongodb.uri=${MONGODB_URI:mongodb+srv://admin_db_user:HdhPLHmhHEhxSUTa@probestack-prod.mby902c.mongodb.net/probestack-forgesphere?appName=probestack-prod&readPreference=secondaryPreferred&retryWrites=true&w=majority}
# spring.data.mongodb.uri=${MONGODB_URI:mongodb+srv://admin_db_user:HdhPLHmhHEhxSUTa@probestack-prod.mby902c.mongodb.net/probestack-forgesphere?appName=probestack-prod&readPreference=secondaryPreferred&retryWrites=true&w=majority}

#################################################
## Compliance scan workspace configuration
#################################################

compliance.scan.workspace-root=${COMPLIANCE_SCAN_WORKSPACE_ROOT:${java.io.tmpdir}/probestack-compliance-scans}
compliance.onboarding.base-url=${COMPLIANCE_ONBOARDING_BASE_URL:https://forgesphere.probestack.io}
compliance.scan.async.core-pool-size=${COMPLIANCE_SCAN_ASYNC_CORE_POOL_SIZE:2}
compliance.scan.async.max-pool-size=${COMPLIANCE_SCAN_ASYNC_MAX_POOL_SIZE:4}
compliance.scan.async.queue-capacity=${COMPLIANCE_SCAN_ASYNC_QUEUE_CAPACITY:25}

#################################################
## Live endpoint resolution for compliance probes
#################################################

compliance.live-endpoint.base-url=${COMPLIANCE_LIVE_ENDPOINT_BASE_URL:https://forgesphere.probestack.io}
compliance.live-endpoint.microservice-base=${COMPLIANCE_LIVE_ENDPOINT_MICROSERVICE_BASE:}
compliance.live-endpoint.apigee-base=${COMPLIANCE_LIVE_ENDPOINT_APIGEE_BASE:}
compliance.live-endpoint.kong-base=${COMPLIANCE_LIVE_ENDPOINT_KONG_BASE:}

# ===== Email (SendGrid) =====
spring.mail.host=smtp.sendgrid.net
spring.mail.port=587
spring.mail.username=apikey
spring.mail.password=${SENDGRID_API_KEY:noop-disable-mail}
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.default-encoding=UTF-8
forgesphere.email.from=${EMAIL_FROM:ForgeSphere <info@probestack.io>}
forgesphere.email.sendgrid-api-key=${SENDGRID_API_KEY:noop-disable-mail}
