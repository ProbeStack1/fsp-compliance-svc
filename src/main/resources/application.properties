spring.application.name=compliance-api
server.port=8188
server.servlet.context-path=/compliance-api
spring.jackson.date-format=com.probestack.forgesphere.RFC3339DateFormat
spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false

# ===== Template Properties =====
#################################################
## Management endpoints configurations
#################################################
management.endpoints.web.exposure.include=info,health,env
management.endpoint.health.show-details=always
management.health.mail.enabled=false

#################################################
## Database connection configuration
#################################################

spring.data.mongodb.uri=${MONGODB_URI:mongodb+srv://admin_db_user:HdhPLHmhHEhxSUTa@probestack-prod.mby902c.mongodb.net/probestack-forgesphere?appName=probestack-prod&readPreference=secondaryPreferred&retryWrites=true&w=majority}
# spring.data.mongodb.uri=${MONGODB_URI:mongodb+srv://admin_db_user:HdhPLHmhHEhxSUTa@probestack-prod.mby902c.mongodb.net/probestack-forgesphere?appName=probestack-prod&readPreference=secondaryPreferred&retryWrites=true&w=majority}

#################################################
## Compliance scan workspace configuration
#################################################

compliance.scan.workspace-root=${COMPLIANCE_SCAN_WORKSPACE_ROOT:${java.io.tmpdir}/probestack-compliance-scans}
compliance.onboarding.base-url=${COMPLIANCE_ONBOARDING_BASE_URL:https://forgesphere.probestack.io}
compliance.onboarding.user-email=${COMPLIANCE_ONBOARDING_USER_EMAIL:system@forgesphere.probestack.io}
compliance.onboarding.user-role=${COMPLIANCE_ONBOARDING_USER_ROLE:ORG_ADMIN}
compliance.scan.async.core-pool-size=${COMPLIANCE_SCAN_ASYNC_CORE_POOL_SIZE:2}
compliance.scan.async.max-pool-size=${COMPLIANCE_SCAN_ASYNC_MAX_POOL_SIZE:4}
compliance.scan.async.queue-capacity=${COMPLIANCE_SCAN_ASYNC_QUEUE_CAPACITY:25}

#################################################
## Live endpoint resolution for compliance probes
#################################################

compliance.live-endpoint.base-url=${COMPLIANCE_LIVE_ENDPOINT_BASE_URL:https://forgesphere.probestack.io}
compliance.live-endpoint.microservice-base=${COMPLIANCE_LIVE_ENDPOINT_MICROSERVICE_BASE:}
compliance.live-endpoint.apigee-base=${COMPLIANCE_LIVE_ENDPOINT_APIGEE_BASE:}
compliance.live-endpoint.kong-base=${COMPLIANCE_LIVE_ENDPOINT_KONG_BASE:}

# ===== Email (SendGrid) =====
spring.mail.host=smtp.sendgrid.net
spring.mail.port=587
spring.mail.username=apikey
spring.mail.password=${SENDGRID_API_KEY:noop-disable-mail}
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.default-encoding=UTF-8
forgesphere.email.from=${EMAIL_FROM:ForgeSphere <info@probestack.io>}
forgesphere.email.sendgrid-api-key=${SENDGRID_API_KEY:noop-disable-mail}

# ===== Forge Authentication Library =====
forge.authn.enabled=${FORGE_AUTHN_ENABLED:true}
forge.authn.issuer-uri=${FORGE_AUTHN_ISSUER_URI:https://auth.probestack.io}
forge.authn.audience=${FORGE_AUTHN_AUDIENCE:probestack-api}
forge.authn.jwks-uri=${FORGE_AUTHN_JWKS_URI:https://probestack.io/admin-backend/api/public/users/context-token/jwks}
forge.authn.jwks-cache-duration-hours=24
forge.authn.connect-timeout-ms=3000
forge.authn.read-timeout-ms=5000
compliance.authn.cookie-name=${AUTH_COOKIE_NAME:ps_auth_token}

# ===== Outbound service-to-service token (ps-token-issuer-svc) =====
# Used by OnboardingResourceResolver to call fsp-onboarding-svc as this service, not a spoofed user.
# Disabled until this service's issuer client is provisioned AND fsp-onboarding-svc has
# ONBOARDING_SERVICE_TOKEN_VALIDATION_ENABLED=true. Secret comes only from a K8s Secret / env.
forge.service-token.enabled=${FORGE_SERVICE_TOKEN_ENABLED:true}
forge.service-token.token-url=${TOKEN_ISSUER_TOKEN_URL:https://probestack.io/token-issuer-api/api/v1/service-tokens}
forge.service-token.client-id=${TOKEN_ISSUER_CLIENT_ID:fsp-compliance-svc}
forge.service-token.client-secret=${TOKEN_ISSUER_CLIENT_SECRET:}
forge.service-token.audience=${TOKEN_ISSUER_AUDIENCE:probestack-api}
forge.service-token.organization-id=${TOKEN_ISSUER_ORGANIZATION_ID:}
forge.service-token.scope=${TOKEN_ISSUER_SCOPE:onboarding:applications:read}

# ===== Forge Logging Library =====
forge.logging.enabled=true
forge.logging.exclude-endpoints=/actuator/**,/health,/info
forge.logging.mask-header-keys=Authorization,Cookie,X-API-Key,X-Auth-Token
forge.logging.mask-request-keys=password,secret,token,pat,apiKey,privateKey,clientSecret
forge.logging.mask-response-keys=password,secret,token,pat,apiKey,privateKey,clientSecret
forge.logging.json-log-format=false
forge.logging.masking-logs-enabled=true
forge.logging.filter-order=10
